<!DOCTYPE HTML>
<html>

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>{{ page.title }} - {{ site.title }}</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="{{ page.excerpt | strip_html | truncatewords: 50 }}" />

	<link href="https://fonts.googleapis.com/css?family=Quicksand:300,400,500,700" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css?family=Playfair+Display:400,400i,700" rel="stylesheet">

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.7/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

	<script>
		MathJax = {
			tex: {
				inlineMath: [['$', '$'], ['\\(', '\\)']],
				displayMath: [['$$', '$$'], ['\\[', '\\]']]
			}
		};
	</script>
	<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
	<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

	<style>
		.post-container {
			max-width: 780px;
			margin: 0 auto;
			padding: 2em;
		}
		.post-header {
			margin-bottom: 2em;
			border-bottom: 1px solid #e6e6e6;
			padding-bottom: 1em;
		}
		.post-title {
			font-family: "Playfair Display", Georgia, serif;
			font-size: 32px;
			margin-bottom: 0.5em;
		}
		.post-meta {
			color: rgba(0, 0, 0, 0.5);
			font-size: 14px;
		}
		.post-meta .tag {
			display: inline-block;
			background: #f2f3f7;
			padding: 2px 10px;
			border-radius: 3px;
			margin-right: 5px;
			font-size: 12px;
		}
		.post-content {
			line-height: 1.8;
			font-size: 16px;
		}
		.post-content h2 {
			margin-top: 2em;
			margin-bottom: 0.8em;
		}
		.post-content p {
			margin-bottom: 1.2em;
		}
		.post-content img {
			max-width: 100%;
			height: auto;
			margin: 1em 0;
		}
		.post-content table {
			width: 100%;
			margin: 1em 0;
			border-collapse: collapse;
		}
		.post-content th, .post-content td {
			padding: 8px 12px;
			border: 1px solid #ddd;
			text-align: left;
		}
		.post-content th {
			background: #f2f3f7;
		}
		.post-content blockquote {
			border-left: 4px solid #2c98f0;
			padding-left: 1em;
			margin: 1em 0;
			color: rgba(0, 0, 0, 0.6);
		}
		.back-link {
			display: inline-block;
			margin-bottom: 2em;
			color: #2c98f0;
		}
		.back-link:hover {
			text-decoration: none;
		}
	</style>

</head>

<body>
	<div id="colorlib-page">
		<div class="container-wrap">
			<a href="#" class="js-colorlib-nav-toggle colorlib-nav-toggle" data-toggle="collapse" data-target="#navbar"
				aria-expanded="false" aria-controls="navbar"><i></i></a>
			<aside id="colorlib-aside" role="complementary" class="border">
				{% include sidebar.html %}
			</aside>

			<div id="colorlib-main">
				<div class="post-container">
					<a href="{{ '/blog' | relative_url }}" class="back-link">
						<i class="fa fa-arrow-left"></i> Back to Blog
					</a>
					
					<article>
						<div class="post-header">
							<h1 class="post-title">{{ page.title }}</h1>
							<div class="post-meta">
								<span>{{ page.date | date: "%Y-%m-%d" }}</span>
								{% if page.tags.size > 0 %}
								<span> · </span>
								{% for tag in page.tags %}
								<span class="tag">{{ tag }}</span>
								{% endfor %}
								{% endif %}
							</div>
						</div>
						
						<div class="post-content">
							{{ content }}
						</div>
					</article>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.7/js/bootstrap.min.js"></script>
	<script src="{{ '/assets/js/main.js' | relative_url }}"></script>

</body>

</html>
